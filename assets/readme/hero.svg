<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">书香管家 — 家庭藏书管理器</title>
  <desc id="desc">暖纸底标题：书香管家，拍下书架，逐本校对，找到每一本书的位置；右侧是拍照识书到 3D 虚拟书架的示意：扫描框里的书架照片变成一排彩色书脊。</desc>

  <rect width="1200" height="360" rx="26" fill="#f5f1e8"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#5a6152">家庭藏书管理器 · AI 拍照识书</text>
    <text x="56" y="130" font-size="64" font-weight="700" fill="#2f3a2c">书香管家</text>
    <text x="56" y="170" font-size="23" fill="#536b43">拍下书架，逐本校对，找到每一本书的位置</text>
    <text x="56" y="204" font-size="19" fill="#5a6152">照片识别 + 手动录入，数据只存当前浏览器。</text>
    <g id="chips" font-size="18" fill="#2f3a2c" text-anchor="middle">
      <g><rect x="56" y="238" width="144" height="36" rx="18" fill="#ece5d3" stroke="#d5cdb4" stroke-width="1.5"/><text x="128" y="262">AI 拍照识书</text></g>
      <g><rect x="212" y="238" width="144" height="36" rx="18" fill="#ece5d3" stroke="#d5cdb4" stroke-width="1.5"/><text x="284" y="262">3D 虚拟书架</text></g>
      <g><rect x="368" y="238" width="126" height="36" rx="18" fill="#ece5d3" stroke="#d5cdb4" stroke-width="1.5"/><text x="431" y="262">阅读状态</text></g>
      <g><rect x="506" y="238" width="126" height="36" rx="18" fill="#ece5d3" stroke="#d5cdb4" stroke-width="1.5"/><text x="569" y="262">JSON 备份</text></g>
    </g>
  </g>

  <g id="shelf-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="740" y="46" font-size="18" fill="#5a6152">拍照 → 识别 → 归档</text>
    <g id="scan-frame">
      <rect x="740" y="62" width="120" height="150" rx="10" fill="#ece5d3" stroke="#d5cdb4" stroke-width="1.5"/>
      <g stroke="#536b43" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M752 86 L752 74 L764 74"/><path d="M836 74 L848 74 L848 86"/>
        <path d="M752 188 L752 200 L764 200"/><path d="M836 200 L848 200 L848 188"/>
      </g>
      <g>
        <rect x="762" y="96" width="18" height="80" rx="2" fill="#1f3a2d"/>
        <rect x="782" y="96" width="18" height="80" rx="2" fill="#b09a72"/>
        <rect x="802" y="96" width="18" height="80" rx="2" fill="#b03a3a"/>
        <rect x="822" y="96" width="18" height="80" rx="2" fill="#2c3e6b"/>
      </g>
      <text x="800" y="240" font-size="18" fill="#2f3a2c" text-anchor="middle">书架照片</text>
    </g>
    <text x="878" y="142" font-size="26" fill="#536b43" text-anchor="middle">→</text>
    <g id="mini-shelf">
      <rect x="900" y="62" width="260" height="150" rx="10" fill="#ece5d3" stroke="#d5cdb4" stroke-width="1.5"/>
      <g>
        <rect x="920" y="96" width="34" height="96" rx="3" fill="#1f3a2d"/>
        <rect x="958" y="86" width="34" height="106" rx="3" fill="#b09a72"/>
        <rect x="996" y="100" width="34" height="92" rx="3" fill="#c9c9c4"/>
        <rect x="1034" y="90" width="34" height="102" rx="3" fill="#b03a3a"/>
        <rect x="1072" y="98" width="34" height="94" rx="3" fill="#2c3e6b"/>
        <rect x="912" y="192" width="236" height="10" rx="3" fill="#c9a876"/>
      </g>
      <text x="1030" y="240" font-size="18" fill="#2f3a2c" text-anchor="middle">虚拟书架 · 按层按位置还原</text>
    </g>
    <g id="diagram-note" text-anchor="middle">
      <text x="950" y="292" font-size="19" fill="#5a6152">层数 + 左右位置，找书不再翻箱倒柜</text>
    </g>
  </g>
</svg>
